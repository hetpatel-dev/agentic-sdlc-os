openapi: 3.1.0
info:
  title: Authentication Service API
  version: 1.0.0
  description: Cryptographic session token issuance and verification service.
paths:
  /auth/login:
    post:
      summary: Authenticate user credentials and issue signed token
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                required: [token, expires_at]
                properties:
                  token:
                    type: string
                  expires_at:
                    type: integer
        '401':
          description: Invalid username or password
