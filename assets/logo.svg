  <rect width="100" height="100" rx="20" fill="#0A0F1D" />
  <circle cx="50" cy="50" r="32" stroke="url(#brandGrad)" stroke-width="3" fill="none" opacity="0.3" />
  <circle cx="50" cy="50" r="24" stroke="url(#brandGrad)" stroke-width="4" fill="none" />
  <polygon points="50,22 64,36 50,50 36,36" fill="url(#brandGrad)" filter="url(#glow)" />
  <polygon points="50,50 64,64 50,78 36,64" fill="url(#brandGrad)" filter="url(#glow)" opacity="0.8" />
  <circle cx="50" cy="50" r="5" fill="#FFFFFF" />
